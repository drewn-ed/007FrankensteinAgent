<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Event desk · Practice app</title><link rel="stylesheet" href="/practice.css"><script src="/practice.js" defer></script></head><body><header><strong>Event desk</strong><span>Local practice app</span></header><main><p class="eyebrow">Workshop registration</p><h1>Make room for good ideas.</h1><p>A working practice form for testing browser control. No data is sent anywhere.</p><section><form id="registration"><h2>Add a participant</h2><label>Name<input id="name" name="name" required placeholder="Full name"></label><label>Email<input id="email" name="email" type="email" required placeholder="name@example.com"></label><label>Workshop<select id="workshop" name="workshop"><option value="design">Product design</option><option value="agents">Building agents</option><option value="story">Storytelling</option></select></label><label class="inline"><input type="checkbox" id="checked">Checked in</label><button type="submit">Add participant</button><p role="status" id="status"></p></form><div><h2>Participants</h2><p id="count">No participants yet.</p><div id="participants"></div></div></section></main></body></html>
